# RabbitMQ cho tính năng cache biến thể query hot (docs/query-file-cache-queue-design.md).
# Chỉ hạ tầng — server Node và worker Python vẫn chạy ngoài, mỗi bên npm/pip riêng.
services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # management UI (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    # Có trần bộ nhớ + LRU vì Node ghi 1 key/biến thể cho MỌI lượt miss (TTL 30s)
    # — số tổ hợp filter không giới hạn. Không đặt trần thì Redis mặc định ăn RAM
    # tới khi lỗi write/OOM thay vì evict. Mất key chỉ là chạy SQL live.
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
